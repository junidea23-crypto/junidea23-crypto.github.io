# Dalbit weather auto update
name: 달빛 사주관 날씨 파일

on:
  schedule:
    - cron: "25 17 * * *"   # 매일 02:25 (한국 시각) — 02시 발표
    - cron: "25 8 * * *"    # 매일 17:25 (한국 시각) — 17시 발표
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dalbit-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 기상청·에어코리아 예보 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python .github/scripts/dalbit_weather.py
      - name: 바뀐 파일 올리기
        run: |
          git config user.name "dalbit-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saju/weather.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; else git commit -m "날씨 파일 갱신" && git push; fi
